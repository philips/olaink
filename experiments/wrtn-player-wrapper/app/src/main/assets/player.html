<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WRTN Companion fixture</title>
  <style>
    :root { color-scheme: light; background: #f7f4ed; color: #1a1a1a; font: 16px system-ui, sans-serif; }
    body { margin: 0; display: flex; min-height: 100vh; flex-direction: column; }
    header { padding: 12px 16px; background: #f7f4ed; border-bottom: 1px solid #bdb8ac; }
    h1 { font-size: 18px; margin: 0 0 5px; }
    #status { color: #4e4a42; white-space: pre-wrap; }
    supernote-viewer { display: block; flex: 1; min-height: 0; }
  </style>
  <script type="module" src="supernote-viewer.js"></script>
</head>
<body>
  <header>
    <h1>WRTN Companion fixture</h1>
    <div id="status">Loading pinned viewer bundle…</div>
  </header>
  <supernote-viewer id="viewer" bare></supernote-viewer>
  <script type="module">
    const status = document.querySelector('#status');
    const viewer = document.querySelector('#viewer');
    const draftId = new URLSearchParams(location.search).get('draftId');

    function report(type, details) {
      const message = { type, draftId, ...details };
      console.log('[wrtn-player]', JSON.stringify(message));
      window.WrtnPlayer?.postMessage(JSON.stringify(message));
    }

    const capabilities = {
      customElements: typeof window.customElements !== 'undefined',
      worker: typeof window.Worker !== 'undefined',
      fetch: typeof window.fetch === 'function',
      constructableStyleSheets:
        typeof window.CSSStyleSheet !== 'undefined' &&
        'replaceSync' in window.CSSStyleSheet.prototype &&
        'adoptedStyleSheets' in Document.prototype,
      webViewBridge: typeof window.WrtnPlayer?.postMessage === 'function',
      userAgent: navigator.userAgent,
    };
    report('capabilities', { capabilities });
    await customElements.whenDefined('supernote-viewer');

    viewer.addEventListener('supernote-load', (event) => {
      const { pageCount, pageWidth, pageHeight } = event.detail;
      status.textContent = `Loaded ${pageCount} page(s), ${pageWidth} × ${pageHeight}. Press Play to replay ink.`;
      report('supernote-load', { pageCount, pageWidth, pageHeight, presentation: viewer.presentation });
    });
    viewer.addEventListener('supernote-error', (event) => {
      const error = String(event.detail.error?.message ?? event.detail.error);
      status.textContent = `Viewer error: ${error}`;
      report('supernote-error', { error, pageNumber: event.detail.pageNumber ?? null });
    });

    try {
      // This is the production-safe loading order: the note bytes are never a
      // URL/query parameter, and write-on starts deliberately paused.
      viewer.presentation = 'write-on-paused';
      const response = await fetch('./fixture-write-on.note');
      if (!response.ok) throw new Error(`fixture fetch failed: ${response.status}`);
      viewer.noteData = await response.arrayBuffer();
    } catch (error) {
      const message = String(error?.message ?? error);
      status.textContent = `Unable to load fixture: ${message}`;
      report('fixture-error', { error: message });
    }
  </script>
</body>
</html>
