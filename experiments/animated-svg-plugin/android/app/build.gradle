import org.gradle.api.GradleException

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.olaink.svgprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.olaink.svgprobe'
        // android.util.PathParser used by this Nomad-only probe requires API 26.
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '0.0.18-tests-v1'
    }
}

dependencies {
    implementation 'com.facebook.react:react-android:0.79.2'
}

tasks.register('buildPluginNpk') {
    group = 'build'
    description = 'Builds the arm64 PluginHost native SVG-scene package (app.npk).'
    dependsOn 'assembleDebug'

    doLast {
        def input = file("${layout.buildDirectory.get().asFile}/outputs/apk/debug/app-debug.apk")
        if (!input.isFile()) throw new GradleException("Missing debug APK: ${input}")

        def stage = file("${layout.buildDirectory.get().asFile}/intermediates/npk")
        delete(stage)
        copy { from zipTree(input); into stage }

        def libRoot = file("${stage}/lib")
        if (libRoot.isDirectory()) {
            libRoot.listFiles().each { abi -> if (abi.isDirectory() && abi.name != 'arm64-v8a') delete(abi) }
            def arm64 = file("${libRoot}/arm64-v8a")
            [
                'libc++_shared.so', 'libfbjni.so', 'libhermes.so',
                'libhermestooling.so', 'libimagepipeline.so', 'libjsi.so',
                'libnative-filters.so', 'libnative-imagetranscoder.so',
                'libreactnative.so'
            ].each { name -> delete(file("${arm64}/${name}")) }
        }

        def output = file("${layout.buildDirectory.get().asFile}/outputs/npk/app.npk")
        output.parentFile.mkdirs()
        delete(output)
        ant.zip(destfile: output, basedir: stage)
        if (!output.isFile() || output.length() == 0) throw new GradleException("Could not create ${output}")
        println "Plugin native package: ${output} (${output.length()} bytes)"
    }
}
