<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Soft, warm e-paper background card -->
  <rect width="500" height="500" rx="36" fill="#F6F4EF"/>

  <!-- Outer subtle circular halo representing slow rhythm -->
  <circle cx="250" cy="215" r="120" fill="none" stroke="#E2DDD3" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Group: Main Icon (Palm Leaf + Pen Nib Hybrid) -->
  <g transform="translate(0, 5)">
    <!-- Base Leaf / Nib Silhouette -->
    <path d="M 250 95 
             C 305 125, 315 205, 280 260 
             L 250 295 
             L 220 260 
             C 185 205, 195 125, 250 95 Z" 
          fill="#233329"/>

    <!-- Pen Nib Breather Hole -->
    <circle cx="250" cy="185" r="10" fill="#F6F4EF"/>

    <!-- Center Slit / Main Leaf Vein -->
    <line x1="250" y1="185" x2="250" y2="295" stroke="#F6F4EF" stroke-width="4" stroke-linecap="round"/>

    <!-- Palm Leaf Cutouts / Veins -->
    <path d="M 250 155 L 226 142
             M 250 155 L 274 142
             M 250 215 L 222 200
             M 250 215 L 278 200
             M 250 245 L 228 230
             M 250 245 L 272 230" 
          stroke="#F6F4EF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Droplet of Ink leaving the nib tip -->
    <path d="M 250 320 
             C 243 320, 238 325, 238 332 
             C 238 342, 250 352, 250 352 
             C 250 352, 262 342, 262 332 
             C 262 325, 257 320, 250 320 Z" 
          fill="#233329"/>
  </g>

  <!-- Typography -->
  <!-- Main Brand Title -->
  <text x="250" y="415" 
        font-family="'Georgia', 'Times New Roman', serif" 
        font-size="34" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#233329" 
        text-anchor="middle">OLA INK</text>

  <!-- Subtitle -->
  <text x="250" y="442" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#7A8A80" 
        text-anchor="middle">CALM WRITTEN CHAT</text>
</svg>
