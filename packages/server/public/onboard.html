<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ola Ink device pairing</title>
  <style>
    :root { color-scheme: light; font: 16px system-ui, sans-serif; color: #1a1a1a; background: #f7f4ed; }
    main { max-width: 38rem; margin: 8vh auto; padding: 0 1rem; }
    section { margin: 1rem 0; padding: 1rem; border: 1px solid #bdb8ac; background: #fffdf8; }
    h1 { margin-bottom: .25rem; } p, #status { line-height: 1.45; }
    label { display: grid; gap: .25rem; } input, button { font: inherit; padding: .5rem; }
    button { margin: .25rem .25rem .25rem 0; } code { overflow-wrap: anywhere; }
    #code { font-size: 1.3rem; font-weight: bold; letter-spacing: .06em; }
  </style>
</head>
<body>
  <main>
    <h1>Pair an Ola Ink companion</h1>
    <p id="status">Set up AuthGravity, then sign in with a passkey.</p>
    <section>
      <label>AuthGravity endpoint
        <input id="auth-endpoint" type="url" value="http://localhost:8787" autocomplete="url">
      </label>
      <p><button id="register">Create Account</button><button id="login">Login</button></p>
      <p><a href="https://authgravity.org/">Powered by AuthGravity</a></p>
    </section>
    <section>
      <p>After signing in, create a one-time pairing code and enter it into the Supernote companion. This browser's device key is also enrolled.</p>
      <button id="pair" disabled>Create pairing code</button>
      <p id="code" hidden></p>
    </section>
  </main>
  <script type="module">
    const status = document.querySelector('#status');
    const endpoint = document.querySelector('#auth-endpoint');
    const registerButton = document.querySelector('#register');
    const loginButton = document.querySelector('#login');
    const pairButton = document.querySelector('#pair');
    const code = document.querySelector('#code');
    const DB_NAME = 'olaink-primary-device-v1';
    const STORE = 'keys';
    const KEY = 'device';
    let device;

    function message(text) { status.textContent = text; }
    function baseUrl() {
      const url = endpoint.value.trim().replace(/\/$/, '');
      if (!/^https?:\/\/.+/.test(url)) throw new Error('enter an AuthGravity endpoint');
      localStorage.setItem('olaink-authgravity-endpoint', url);
      return url;
    }
    function b64url(data) {
      const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }
    function bytes(value) {
      const binary = atob(value.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((value.length + 3) % 4));
      return Uint8Array.from(binary, char => char.charCodeAt(0));
    }
    function toCreationOptions(options) {
      return {
        ...options, challenge: bytes(options.challenge), user: { ...options.user, id: bytes(options.user.id) },
        excludeCredentials: options.excludeCredentials?.map(item => ({ ...item, id: bytes(item.id) })),
      };
    }
    function toRequestOptions(options) {
      return {
        ...options, challenge: bytes(options.challenge),
        allowCredentials: options.allowCredentials?.map(item => ({ ...item, id: bytes(item.id) })),
      };
    }
    function credentialJson(credential) {
      const response = credential.response;
      const json = {
        id: credential.id, rawId: b64url(credential.rawId), type: credential.type,
        response: { clientDataJSON: b64url(response.clientDataJSON) },
        clientExtensionResults: credential.getClientExtensionResults(),
      };
      if ('attestationObject' in response) {
        json.response.attestationObject = b64url(response.attestationObject);
        json.response.transports = response.getTransports?.() ?? [];
      } else {
        json.response.authenticatorData = b64url(response.authenticatorData);
        json.response.signature = b64url(response.signature);
        if (response.userHandle) json.response.userHandle = b64url(response.userHandle);
      }
      return json;
    }
    async function authApi(path, init = {}) {
      const res = await fetch(baseUrl() + path, { ...init, credentials: 'include', headers: { ...(init.body ? { 'Content-Type': 'application/json' } : {}), ...(init.headers || {}) } });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `AuthGravity returned ${res.status}`);
      return body;
    }
    async function auth(action) {
      if (!window.PublicKeyCredential) throw new Error('this browser does not support passkeys');
      const options = await authApi(`/v1/${action}/options`);
      const credential = action === 'register'
        ? await navigator.credentials.create({ publicKey: toCreationOptions(options) })
        : await navigator.credentials.get({ publicKey: toRequestOptions(options) });
      if (!credential) throw new Error('passkey action was cancelled');
      const result = await authApi(`/v1/${action}/verify`, { method: 'POST', body: JSON.stringify(credentialJson(credential)) });
      if (!result.verified) throw new Error('AuthGravity did not verify the passkey');
      return result.user.id;
    }
    async function db() {
      return new Promise((resolve, reject) => {
        const open = indexedDB.open(DB_NAME, 1);
        open.onupgradeneeded = () => open.result.createObjectStore(STORE);
        open.onsuccess = () => resolve(open.result); open.onerror = () => reject(open.error);
      });
    }
    async function getDevice() {
      const database = await db();
      const saved = await new Promise((resolve, reject) => {
        const request = database.transaction(STORE).objectStore(STORE).get(KEY);
        request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
      });
      if (saved) return saved;
      const generated = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
      const privateKey = await crypto.subtle.importKey('pkcs8', await crypto.subtle.exportKey('pkcs8', generated.privateKey), { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
      const result = { deviceId: `primary_${crypto.randomUUID().replace(/-/g, '')}`, privateKey, publicKeySpki: b64url(await crypto.subtle.exportKey('spki', generated.publicKey)) };
      await new Promise((resolve, reject) => {
        const request = database.transaction(STORE, 'readwrite').objectStore(STORE).put(result, KEY);
        request.onsuccess = () => resolve(); request.onerror = () => reject(request.error);
      });
      return result;
    }
    async function whoami() {
      const response = await fetch(baseUrl() + '/v1/whoami', { credentials: 'include' });
      if (!response.ok) return null;
      return response.json();
    }
    async function refresh() {
      try {
        const user = await whoami();
        pairButton.disabled = !user?.user_id;
        message(user?.user_id ? 'Signed in. Create a pairing code for your companion.' : 'Set up AuthGravity, then sign in with a passkey.');
      } catch (error) { message(`AuthGravity unavailable: ${error.message}`); }
    }
    registerButton.onclick = async () => { try { message('Creating passkey…'); const user = await auth('register'); message(`Signed in as ${user}. Create a pairing code.`); pairButton.disabled = false; } catch (error) { message(`Registration failed: ${error.message}`); } };
    loginButton.onclick = async () => { try { message('Waiting for passkey…'); const user = await auth('login'); message(`Signed in as ${user}. Create a pairing code.`); pairButton.disabled = false; } catch (error) { message(`Login failed: ${error.message}`); } };
    pairButton.onclick = async () => {
      try {
        pairButton.disabled = true; message('Enrolling this browser device…');
        const res = await fetch('/v1/prototype/pairings', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ device: { deviceId: device.deviceId, publicKeySpki: device.publicKeySpki } }) });
        const body = await res.json(); if (!res.ok) throw new Error(body.error || `Ola Ink returned ${res.status}`);
        code.hidden = false; code.textContent = body.pairing.code;
        message(`Enter this code in the companion within ${Math.ceil((body.pairing.expiresAt - Date.now()) / 60000)} minutes.`);
      } catch (error) { message(`Could not create pairing code: ${error.message}`); pairButton.disabled = false; }
    };
    endpoint.value = localStorage.getItem('olaink-authgravity-endpoint') || endpoint.value;
    device = await getDevice();
    await refresh();
  </script>
</body>
</html>
