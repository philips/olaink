name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["*"]
    paths:
      - "android/**"
      - "packages/plugin/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "packages/sn-stub/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew :app:assembleDebug
        working-directory: android
      - name: Name the distributable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ola-ink-companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ola-ink-companion-debug-apk
          path: ola-ink-companion.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ola-ink-companion.apk --repo "$GITHUB_REPOSITORY" --title "Ola Ink $GITHUB_REF_NAME" --generate-notes
