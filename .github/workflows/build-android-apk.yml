name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["*"]
    paths:
      - "android/**"
      - "packages/plugin/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "packages/sn-stub/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/embed-onboard-page.mjs"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build server and development companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm run build:server
      - run: npm run build:server:arm64
      - name: Name the distributable servers
        run: |
          cp dist/olaink-server ola-ink-server-linux-x64
          cp dist/olaink-server-linux-arm64 ola-ink-server-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ola-ink-server-linux-x64
          path: ola-ink-server-linux-x64
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ola-ink-server-linux-arm64
          path: ola-ink-server-linux-arm64
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-java@v5
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew :app:assembleDebug
        working-directory: android
      - name: Verify development APK routing and signature
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./scripts/verify-variant-apk.sh debug app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
        working-directory: android
      - name: Name the development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ola-ink-companion-dev.apk
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ola-ink-companion-dev-apk
          path: ola-ink-companion-dev.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign and publish stable companion
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || {
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured for the release environment" >&2
            exit 1
          }
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/olaink-release.jks"
          test -s "$RUNNER_TEMP/olaink-release.jks"
      - name: Set release version
        run: |
          VERSION_CODE="$(git rev-list --count HEAD)"
          test "$VERSION_CODE" -gt 2 || {
            echo "Release version code must exceed the previous published value" >&2
            exit 1
          }
          echo "OLAINK_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "OLAINK_VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_olainkReleaseStoreFile: ${{ runner.temp }}/olaink-release.jks
          ORG_GRADLE_PROJECT_olainkReleaseStorePassword: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_olainkReleaseKeyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_olainkReleaseKeyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_olainkVersionCode: ${{ env.OLAINK_VERSION_CODE }}
          ORG_GRADLE_PROJECT_olainkVersionName: ${{ env.OLAINK_VERSION_NAME }}
        run: ./gradlew :app:assembleRelease
        working-directory: android
      - name: Verify release routing and certificate
        id: verify_release_certificate
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          test -n "$ANDROID_RELEASE_CERT_SHA256" || {
            echo "ANDROID_RELEASE_CERT_SHA256 Actions variable is not configured" >&2
            exit 1
          }
          APK="android/app/build/outputs/apk/release/app-release.apk"
          android/scripts/verify-variant-apk.sh release "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/ { print toupper($2); exit }')"
          EXPECTED="${ANDROID_RELEASE_CERT_SHA256^^}"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "APK certificate fingerprint does not match ANDROID_RELEASE_CERT_SHA256" >&2
            exit 1
          }
          echo "fingerprint=$ACTUAL" >> "$GITHUB_OUTPUT"
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/ola-ink-companion.apk
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: ola-ink-server-linux-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE_SHA256: ${{ steps.verify_release_certificate.outputs.fingerprint }}
        run: |
          printf '### Android signing certificate\n\nSHA-256: `%s`\n' "$CERTIFICATE_SHA256" > release-notes.md
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --title "Ola Ink $GITHUB_REF_NAME" --notes-file release-notes.md
      - name: Remove decoded release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/olaink-release.jks"
