name: Deploy the service Worker

# main → tests → staging Worker → (approval) → production Worker, all for the
# same commit in one run. Production waits on the `production` GitHub
# environment's required reviewers, so promotion is a deliberate click after
# that exact commit is live on staging. See packages/server/README.md
# ("Cloudflare deployment") for the one-time setup this needs.
#
# Dormant until the repository variable CLOUDFLARE_DEPLOY is `enabled`, so
# pushes before the Cloudflare account exists do not fail.
on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "scripts/deploy-worker.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway through its
# migrations; a newer push waits for the current run.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  test:
    name: Repo gates
    if: vars.CLOUDFLARE_DEPLOY == 'enabled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:generated
      - run: npm run typecheck
      # Both vitest projects: Node/standalone and workerd with Miniflare D1 + R2.
      - run: npm test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm run test:bun -w @olaink/server

  staging:
    name: Deploy staging
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrate, deploy, smoke check
        run: scripts/deploy-worker.sh staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_URL: ${{ vars.STAGING_URL }}

  production:
    name: Deploy production
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrate, deploy, smoke check
        run: scripts/deploy-worker.sh production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_URL: ${{ vars.PRODUCTION_URL }}
